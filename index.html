function metricHTML(m){return '<div class="metric '+(m.value===null?'empty':'')+'"><span>'+esc(T(m.en,m.ar))+'</span><strong>'+esc(F(m.value,m.unit))+'</strong>'+(m.defEn?'<small>'+esc(T(m.defEn,m.defAr))+'</small>':'')+'</div>';}
function allView(month){return '<div class="overview-grid">'+PLATFORMS.map(p=>{const d=details(p[0],month);return '<article class="platform-card"><div class="cardtop">'+icon(p)+'<div><h3>'+esc(T(p[1],p[2]))+'</h3><span class="status '+d.status+'">'+statusLabel(d.status)+'</span></div></div><div class="preview-metrics">'+d.metrics.slice(0,4).map(metricHTML).join('')+'</div>'+snapshot(d)+'<button class="detail-button" data-platform="'+p[0]+'">'+T('Open platform results','فتح نتائج المنصة')+' <span aria-hidden="true">↗</span></button></article>';}).join('')+'</div>';}
function trend(id,month){const field={meta:['meta_ads','spend'],facebook:['facebook','views'],instagram:['instagram','views'],tiktok:['tiktok','views'],linkedin:['linkedin','total'],gsc:['gsc','clicks'],ga4:['ga4','sessions'],gbp:['gbp','website_clicks'],brevo:['brevo','clicks']}[id];if(!field)return '';const labels={meta:T('Meta ad spend (USD)','إنفاق Meta بالدولار'),facebook:T('Facebook account views','مشاهدات حساب Facebook'),instagram:T('Instagram account views','مشاهدات حساب Instagram'),tiktok:T('TikTok video views','مشاهدات فيديو TikTok'),linkedin:T('LinkedIn impressions','ظهور LinkedIn'),gsc:T('Google Search clicks','نقرات Google Search'),ga4:T('GA4 website sessions','جلسات الموقع (GA4)'),gbp:T('Google Maps website clicks','نقرات الموقع من الخرائط (GBP)'),brevo:T('Brevo direct email clicks','نقرات إيميل Brevo المباشرة')};const vals=DATA.months.map(m=>m[field[0]][field[1]]);const max=Math.max(...vals,1);return '<section class="chart-panel"><div class="section-heading"><h3>'+labels[id]+'</h3><span>'+T('2026 monthly context','سياق الشهور في 2026')+'</span></div><div class="bars">'+DATA.months.map((m,i)=>'<button class="bar-item '+(m.key===month.key?'selected':'')+'" data-month="'+m.key+'" aria-label="'+esc(T(m.name,m.ar)+': '+F(vals[i]))+'"><span class="bar-value">'+F(vals[i])+'</span><span class="bar-track"><span style="height:'+Math.max(2,vals[i]/max*100)+'%"></span></span><span class="bar-label">'+esc(state.lang==='ar'?m.ar:m.name.slice(0,3))+(m.partial?'*':'')+'</span></button>').join('')+'</div><p class="chart-note">'+T('* November is partial. TikTok ends Nov 03; the other available series end Nov 04. Click a bar to select that month.','* نوفمبر جزئي. TikTok ينتهي 3 نوفمبر؛ بقية السلاسل المتاحة تنتهي 4 نوفمبر. اضغط عمودًا لاختيار الشهر.')+'</p></section>';}
function accessCard(id){const a=ACCESS.find(a=>a.id===id);return '<section class="access-card"><div class="section-heading"><h3>'+T('What we need to complete this platform','ما نحتاجه لاستكمال هذه المنصة')+'</h3><span class="priority">'+T('Priority ','الأولوية ')+a.priority+'</span></div><p>'+esc(T(a.need_en,a.need_ar))+'</p><div class="next-step"><b>'+T('Together, next step','الخطوة القادمة معًا')+'</b><p>'+esc(T(a.action_en,a.action_ar))+'</p></div><small>'+esc(T(a.gap_en,a.gap_ar))+'</small></section>';}
function platformView(id,month){const p=PLATFORMS.find(p=>p[0]===id),d=details(id,month);return '<section class="platform-detail"><div class="detail-heading">'+icon(p)+'<div><h2>'+esc(T(p[1],p[2]))+'</h2><p class="account">'+esc(d.account)+'</p></div><span class="status '+d.status+'">'+statusLabel(d.status)+'</span></div><div class="metric-grid">'+d.metrics.map(metricHTML).join('')+'</div>'+snapshot(d)+'<div class="evidence-note">'+d.notes.map(n=>'<p>'+esc(n)+'</p>').join('')+'</div><p class="source">'+T('Source: ','المصدر: ')+'<a href="../'+esc(d.source)+'">'+esc(d.source)+'</a></p></section>'+trend(id,month)+accessCard(id);}
function accessView(){return '<section class="access-intro"><span class="eyebrow">'+T('DATA COLLECTION PLAN','خطة استكمال البيانات')+'</span><h2>'+T('Connect only what is missing.','نوصل للبيانات الناقصة فقط.')+'</h2><p>'+T('Start with monthly GA4 and the correct Google Business Profile. The remaining priorities are listed below. Log in yourself if a platform asks; no passwords or verification codes are needed here.','نبدأ بـGA4 الشهري وملف Google Business Profile الصحيح. بقية الأولويات موضحة أدناه. سجّل الدخول بنفسك إذا طلبت المنصة؛ لا نحتاج كلمات مرور أو أكواد تحقق هنا.')+'</p></section>'+ACCESS.map(a=>'<section class="access-card"><div class="section-heading"><h3>'+a.priority+'. '+esc(a.name)+'</h3><button data-platform="'+a.id+'">'+T('View saved results','عرض النتائج المحفوظة')+'</button></div><p class="account">'+esc(a.account)+'</p><p>'+esc(T(a.need_en,a.need_ar))+'</p><div class="next-step">'+esc(T(a.action_en,a.action_ar))+'</div><small>'+esc(T(a.gap_en,a.gap_ar))+'</small></section>').join('');}
function render(){const m=DATA.months.find(x=>x.key===state.month);document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';$('workspace-label').textContent=T('PERFORMANCE WORKSPACE','لوحة الأداء');$('report-title').textContent=T('Monthly platform results','نتائج المنصات الشهرية');$('report-subtitle').textContent=T('Choose a month. Review each platform separately.','اختَر الشهر، ثم راجع نتائج كل منصة بشكل مستقل.');$('language').textContent=state.lang==='en'?'العربية':'English';$('access-button').textContent=T('What to connect','ما الذي نحتاج الوصول له؟');$('month-label').textContent=T('Reporting month','شهر التقرير');$('month-select').innerHTML=DATA.months.map(m=>'<option value="'+m.key+'" '+(m.key===state.month?'selected':'')+'>'+esc(T(m.name,m.ar))+' 2026'+(m.partial?T(' · partial',' · جزئي'):'')+'</option>').join('');$('nav').innerHTML='<button data-platform="all" class="navitem '+(state.platform==='all'&&!state.access?'active':'')+'"><span class="platform-icon overview">▦</span><span>'+T('All platforms','كل المنصات')+'</span></button>'+PLATFORMS.map(p=>'<button data-platform="'+p[0]+'" class="navitem '+(state.platform===p[0]&&!state.access?'active':'')+'">'+icon(p)+'<span>'+esc(T(p[1],p[2]))+'</span></button>').join('');$('nav-label').textContent=T('REPORTING CHANNELS','قنوات التقرير');$('saved-label').textContent=T('Saved evidence','بيانات محفوظة');$('saved-note').textContent=T('Read 04–05 Nov 2026. Not a live account connection.','قُرئت في 4–5 نوفمبر 2026. ليست اتصالًا مباشرًا بالحسابات.');$('period-title').textContent=T(m.name,m.ar)+' 2026';$('period-tag').textContent=m.partial?T('Partial month','شهر جزئي'):T('Complete calendar month','شهر تقويمي كامل');$('period-desc').textContent=m.partial?T('Nov 01–04 for available data · TikTok Nov 01–03.','1–4 نوفمبر للبيانات المتاحة · TikTok: ‏1–3 نوفمبر.'):T('Monthly results shown only where collected. Missing does not mean zero.','تظهر نتائج الشهر حيث جُمعت فقط. غير المتاح لا يعني صفرًا.');$('page-body').innerHTML=state.access?accessView():state.platform==='all'?allView(m):platformView(state.platform,m);$('footer').textContent=T('UMI GROUP · Prepared 08 Nov 2026 · Source window: Jan 01–Nov 04, with stated exceptions.','UMI GROUP · إعداد 8 نوفمبر 2026 · فترة المصادر: 1 يناير–4 نوفمبر مع الاستثناءات الموضحة.');$('previous').disabled=DATA.months.findIndex(x=>x.key===state.month)===0;$('next').disabled=DATA.months.findIndex(x=>x.key===state.month)===10;}
document.addEventListener('click',e=>{const p=e.target.closest('[data-platform]');if(p){state.platform=p.dataset.platform;state.access=false;render();return;}const m=e.target.closest('[data-month]');if(m){state.month=m.dataset.month;render();}});$('month-select').addEventListener('change',e=>{state.month=e.target.value;render()});$('language').addEventListener('click',()=>{state.lang=state.lang==='en'?'ar':'en';render()});$('access-button').addEventListener('click',()=>{state.access=!state.access;render()});$('previous').addEventListener('click',()=>{const i=DATA.months.findIndex(x=>x.key===state.month);if(i>0){state.month=DATA.months[i-1].key;render()}});$('next').addEventListener('click',()=>{const i=DATA.months.findIndex(x=>x.key===state.month);if(i<10){state.month=DATA.months[i+1].key;render()}});const qs=new URLSearchParams(location.search);if(qs.get('lang')==='ar')state.lang='ar';if(DATA.months.some(m=>m.key===qs.get('month')))state.month=qs.get('month');if(PLATFORMS.some(p=>p[0]===qs.get('platform')))state.platform=qs.get('platform');render();
</script></body></html>
